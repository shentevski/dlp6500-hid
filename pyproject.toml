[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dlp6500-hid"
version = "0.1.0"
description = "Control a DLPC900-based DMD (DLP6500 / DLP9000 / LightCrafter) over USB-HID -- no libusb/Zadig driver install required."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "shentevski", email = "sentevskinaume@gmail.com" }]
keywords = ["DMD", "DLPC900", "DLP6500", "LightCrafter", "Texas Instruments", "HID", "USB"]
dependencies = [
    "hidapi>=0.14",
    "pillow>=10.0",
    "numpy>=1.24",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]

[project.urls]
Homepage = "https://github.com/shentevski/dlp6500-hid"
Issues = "https://github.com/shentevski/dlp6500-hid/issues"

# The pip distribution is "dlp6500-hid"; the importable package is "dlpc900_hid".
[tool.setuptools.packages.find]
include = ["dlpc900_hid*"]
